<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Create your GreenGrid account — turn every problem you solve into a real GitHub commit.">
<title>Sign up — GreenGrid</title>
<link href="css/styles.css" rel="stylesheet">
</head>
<body>

<div class="gg-auth-wrap">
  <div class="commit-grid-bg" id="bg-grid"></div>

  <div class="gg-auth-card">
    <!-- Logo -->
    <div class="gg-auth-logo">
      <span class="gg-logo-mark"><span></span><span></span><span></span><span></span></span>
      GreenGrid
    </div>

    <!-- Heading -->
    <h1 style="font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin-bottom:4px;">Create your account</h1>
    <p class="text-muted-gg mb-4" style="font-size:.875rem;">Your problems. Your repo. Your commits.</p>

    <!-- Register form -->
    <form id="register-form">
      <div class="form-group">
        <label class="form-label-gg" for="displayName">Name</label>
        <input type="text" class="form-control-gg" id="displayName" required
               placeholder="Ada Lovelace" autocomplete="name">
      </div>
      <div class="form-group">
        <label class="form-label-gg" for="email">Email</label>
        <input type="email" class="form-control-gg" id="email" required
               placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label-gg" for="password">Password</label>
        <input type="password" class="form-control-gg" id="password" required
               minlength="8" placeholder="At least 8 characters" autocomplete="new-password">
        <p class="text-muted-gg mt-1 mb-0" style="font-size:.76rem;">Minimum 8 characters.</p>
      </div>
      <button type="submit" class="btn-gg-primary w-100 mt-1 mb-3" id="submit-btn"
              style="justify-content:center;padding:11px;">
        Create account
      </button>
    </form>

    <div class="gg-auth-divider"><span>or</span></div>

    <!-- GitHub button -->
    <button class="btn-github mb-4" id="github-login-btn">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
      </svg>
      Continue with GitHub
    </button>

    <p class="text-center text-muted-gg mb-0" style="font-size:.85rem;">
      Already have an account? <a href="login.html">Log in</a>
    </p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script>
  if (GGAuth.isAuthenticated()) window.location.href = 'dashboard.html';

  const grid = document.getElementById('bg-grid');
  for (let i = 0; i < 120; i++) {
    const cell = document.createElement('span');
    const r = Math.random();
    if (r > 0.9)       cell.className = 'lit-3';
    else if (r > 0.78) cell.className = 'lit-2';
    else if (r > 0.62) cell.className = 'lit-1';
    grid.appendChild(cell);
  }

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.disabled    = true;
    btn.textContent = 'Creating account…';
    try {
      const res = await GGApi.post('/api/auth/register', {
        displayName: document.getElementById('displayName').value.trim(),
        email:       document.getElementById('email').value.trim(),
        password:    document.getElementById('password').value,
      });
      GGAuth.setSession(res.data);
      window.location.href = 'onboarding.html';
    } catch (err) {
      GGToast.error(err);
      btn.disabled    = false;
      btn.textContent = 'Create account';
    }
  });

  document.getElementById('github-login-btn').addEventListener('click', async () => {
    try {
      const res = await fetch(`${GG_API_BASE}/api/auth/github/login-url`).then(r => r.json());
      window.location.href = res.data.authorizeUrl;
    } catch (err) {
      GGToast.error(err);
    }
  });
</script>
</body>
</html>
