<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Your GreenGrid dashboard — track streaks, contributions, and progress.">
<title>Dashboard — GreenGrid</title>
<link href="css/styles.css" rel="stylesheet">
</head>
<body>

<div id="gg-page">
  <!-- Page header -->
  <div class="gg-page-header">
    <div>
      <h1 class="gg-page-title">Dashboard</h1>
      <p class="gg-page-subtitle" id="today-label"></p>
    </div>
    <!-- FIXED: was /problem-form.html (absolute) → problem-form.html (relative) -->
    <a href="problem-form.html" class="btn-gg-primary" id="add-problem-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Add Problem
    </a>
  </div>

  <!-- Stat cards — skeleton until data loads -->
  <div class="row g-3 mb-4" id="stat-cards">
    <div class="col-6 col-lg-3"><div class="gg-stat-card gg-skeleton" style="height:96px;"></div></div>
    <div class="col-6 col-lg-3"><div class="gg-stat-card gg-skeleton" style="height:96px;"></div></div>
    <div class="col-6 col-lg-3"><div class="gg-stat-card gg-skeleton" style="height:96px;"></div></div>
    <div class="col-6 col-lg-3"><div class="gg-stat-card gg-skeleton" style="height:96px;"></div></div>
  </div>

  <!-- Contribution calendar -->
  <div class="row g-3 mb-4">
    <div class="col-12">
      <div class="gg-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="mb-0" style="font-size:.88rem;font-weight:700;letter-spacing:-.01em;">Contribution Calendar</h6>
          <div class="contrib-legend">
            Less
            <div class="contrib-legend-cell" style="background:var(--bg-elevated);border:1px solid var(--border-soft);"></div>
            <div class="contrib-legend-cell" style="background:rgba(63,214,142,0.20);"></div>
            <div class="contrib-legend-cell" style="background:rgba(63,214,142,0.45);"></div>
            <div class="contrib-legend-cell" style="background:rgba(63,214,142,0.70);"></div>
            <div class="contrib-legend-cell" style="background:var(--accent);"></div>
            More
          </div>
        </div>
        <div class="contrib-grid" id="contrib-calendar"></div>
        <div id="contrib-skeleton" class="gg-skeleton mt-1" style="height:60px;display:none;"></div>
      </div>
    </div>
  </div>

  <!-- Breakdown row -->
  <div class="row g-3 mb-4">
    <div class="col-lg-4">
      <div class="gg-card h-100">
        <div class="gg-section-title">Difficulty Breakdown</div>
        <div id="difficulty-breakdown"></div>
      </div>
    </div>
    <div class="col-lg-4">
      <div class="gg-card h-100">
        <div class="gg-section-title">Top Topics</div>
        <div id="topic-breakdown"></div>
      </div>
    </div>
    <div class="col-lg-4">
      <div class="gg-card h-100">
        <div class="gg-section-title">Language Usage</div>
        <div id="language-usage"></div>
      </div>
    </div>
  </div>

  <!-- Quick Dashboard Search / Filter Bar -->
  <div class="gg-card mb-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="gg-section-title mb-0">Search &amp; Filter Problems</div>
      <a href="search.html" class="text-accent" style="font-size:.8rem;text-decoration:none;">View all problems &rarr;</a>
    </div>
    <form id="dash-filter-form" action="search.html" method="GET">
      <div class="row g-2">
        <div class="col-md-5">
          <input type="text" class="form-control-gg" name="search" id="d-search" placeholder="Search title or topics (e.g. Binary Tree)...">
        </div>
        <div class="col-md-3">
          <select class="form-select-gg" name="starred" id="d-starred">
            <option value="">Starred: All</option>
            <option value="true">Starred Only ★</option>
            <option value="false">Not Starred</option>
          </select>
        </div>
        <div class="col-md-3">
          <select class="form-select-gg" name="revisionStatus" id="d-rev-status">
            <option value="">Revision Status: All</option>
            <option value="NONE">Not Set</option>
            <option value="NEEDS_REVISION">Needs Revision</option>
            <option value="MASTERED">Mastered</option>
          </select>
        </div>
        <div class="col-md-1 d-flex">
          <button type="submit" class="btn-gg-primary w-100" title="Filter problems" aria-label="Search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          </button>
        </div>
      </div>
    </form>
  </div>

  <!-- Recent commits + repo status -->
  <div class="row g-3">
    <div class="col-lg-8">
      <div class="gg-card">
        <div class="gg-section-title">Recent Activity</div>
        <div id="recent-commits"></div>
      </div>
    </div>
    <div class="col-lg-4">
      <div class="gg-card h-100">
        <div class="gg-section-title">Repository</div>
        <div id="repo-status"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/shell.js"></script>
<script src="js/constants.js"></script>
<script>
  GGShell.render('dashboard');

  document.getElementById('today-label').textContent = new Date().toLocaleDateString(undefined, {
    weekday: 'long', month: 'long', day: 'numeric',
  });

  const DIFF_COLOR = { EASY: 'var(--easy)', MEDIUM: 'var(--medium)', HARD: 'var(--hard)' };
  const DIFF_LABEL = { EASY: 'Easy', MEDIUM: 'Medium', HARD: 'Hard' };

  // ---- Render helpers -------------------------------------------------------

  function statCard(label, value, sub, iconSvg, accentColor) {
    return `
      <div class="col-6 col-lg-3">
        <div class="gg-stat-card">
          <div class="d-flex align-items-center gap-2 mb-2">
            <div class="gg-stat-icon" style="${accentColor ? `background:${accentColor}1a;color:${accentColor}` : ''}">
              ${iconSvg}
            </div>
            <span class="gg-stat-label" style="margin-bottom:0">${label}</span>
          </div>
          <div class="gg-stat-value">${value}</div>
          ${sub ? `<div class="gg-stat-sub">${sub}</div>` : ''}
        </div>
      </div>`;
  }

  function barRow(label, value, max, color) {
    const pct = max > 0 ? Math.max(4, Math.round((value / max) * 100)) : 0;
    return `
      <div class="gg-bar-row">
        <div class="gg-bar-header">
          <span class="text-secondary-gg">${label}</span>
          <span class="mono text-muted-gg" style="font-size:.78rem;">${value}</span>
        </div>
        <div class="gg-bar-track">
          <div class="gg-bar-fill" style="width:${pct}%;background:${color || 'var(--accent)'}"></div>
        </div>
      </div>`;
  }

  const ICONS = {
    today:  `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`,
    streak: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>`,
    total:  `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`,
    repo:   `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"/></svg>`,
  };

  // ---- Main load ------------------------------------------------------------

  async function load() {
    GGShell.progress.show();
    try {
      const tz  = Intl.DateTimeFormat().resolvedOptions().timeZone;
      const res = await GGApi.get('/api/dashboard?timezone=' + encodeURIComponent(tz));
      const d   = res.data;

      // Stat cards
      document.getElementById('stat-cards').innerHTML =
        statCard('Today', d.todaysProgress, 'problems solved today', ICONS.today, 'var(--accent)') +
        statCard('Streak', d.currentStreak + ' 🔥', 'Longest: ' + d.longestStreak + ' days', ICONS.streak, 'var(--warning)') +
        statCard('Total Solved', d.totalProblemsSolved, 'all time', ICONS.total, 'var(--accent)') +
        statCard('Repository',
          d.repositoryStatus.connected ? '<span style="color:var(--accent);font-size:1.2rem;">●</span> Live' : '—',
          d.repositoryStatus.fullName || 'Not connected',
          ICONS.repo,
          d.repositoryStatus.connected ? 'var(--accent)' : 'var(--text-muted)');

      // Calendar
      renderCalendar(d.contributionCalendar);

      // Difficulty breakdown
      const diffMax = Math.max(1, ...Object.values(d.difficultyBreakdown));
      document.getElementById('difficulty-breakdown').innerHTML =
        ['EASY', 'MEDIUM', 'HARD'].map(k =>
          barRow(DIFF_LABEL[k], d.difficultyBreakdown[k] || 0, diffMax, DIFF_COLOR[k])
        ).join('') ||
        `<div class="gg-empty-state" style="padding:24px 0;">
          <p class="gg-empty-desc" style="margin:0;">Solve your first problem to see the breakdown.</p>
         </div>`;

      // Topic breakdown
      const topics   = Object.entries(d.topicBreakdown).slice(0, 6);
      const topicMax = Math.max(1, ...topics.map(([, v]) => v));
      document.getElementById('topic-breakdown').innerHTML =
        topics.map(([k, v]) => barRow(k, v, topicMax)).join('') ||
        `<div class="gg-empty-state" style="padding:24px 0;">
          <p class="gg-empty-desc" style="margin:0;">No topics tagged yet.</p>
         </div>`;

      // Language usage
      const langs   = Object.entries(d.languageUsage).slice(0, 6);
      const langMax = Math.max(1, ...langs.map(([, v]) => v));
      document.getElementById('language-usage').innerHTML =
        langs.map(([k, v]) => barRow(k, v, langMax)).join('') ||
        `<div class="gg-empty-state" style="padding:24px 0;">
          <p class="gg-empty-desc" style="margin:0;">No languages recorded yet.</p>
         </div>`;

      // Recent commits
      document.getElementById('recent-commits').innerHTML = d.recentCommits.length
        ? d.recentCommits.map(c => `
          <div class="gg-commit-row">
            <div style="min-width:0;flex:1;">
              <div style="font-weight:600;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${c.title}</div>
              <div class="text-muted-gg" style="font-size:.74rem;margin-top:2px;">
                ${c.commitSha ? `<span class="gg-sha">${c.commitSha.substring(0,7)}</span> · ` : ''}${c.solvedDate}
              </div>
            </div>
            <span class="badge-gg badge-status-${c.commitStatus.toLowerCase()}" style="flex-shrink:0;">${c.commitStatus}</span>
          </div>`).join('')
        : `<div class="gg-empty-state">
            <div class="gg-empty-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"/></svg>
            </div>
            <p class="gg-empty-title">No commits yet</p>
            <p class="gg-empty-desc">Solve your first problem and commit it to see activity here.</p>
            <a href="problem-form.html" class="btn-gg-primary">Add your first problem</a>
          </div>`;

      // Repository status
      const rs = d.repositoryStatus;
      document.getElementById('repo-status').innerHTML = rs.connected ? `
        <div class="gg-settings-row" style="padding-top:0;">
          <div>
            <div class="gg-settings-label">Repository</div>
            <div class="mono text-secondary-gg" style="font-size:.82rem;">${rs.fullName}</div>
          </div>
        </div>
        <div class="gg-settings-row">
          <div>
            <div class="gg-settings-label">Status</div>
            <span class="badge-gg badge-status-committed">${rs.lastSyncStatus || 'READY'}</span>
          </div>
        </div>
        <a href="${rs.htmlUrl}" target="_blank" rel="noopener" class="btn-gg-outline w-100 mt-3" style="font-size:.82rem;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"/></svg>
          View on GitHub
        </a>
      ` : `
        <div class="gg-empty-state" style="padding:20px 0;">
          <p class="gg-empty-desc" style="margin:0 0 16px;">No repository connected. Connect one to start committing solutions.</p>
          <a href="onboarding.html" class="btn-gg-primary w-100" style="font-size:.82rem;">Connect repository</a>
        </div>`;

    } catch (err) {
      GGToast.error(err);
    } finally {
      GGShell.progress.done();
    }
  }

  function renderCalendar(days) {
    const el     = document.getElementById('contrib-calendar');
    const skel   = document.getElementById('contrib-skeleton');
    if (!days || days.length === 0) {
      el.style.display   = 'none';
      skel.style.display = 'block';
      return;
    }
    skel.style.display = 'none';
    el.style.display   = '';
    el.innerHTML = days.map(d => {
      let level = 0;
      if (d.count >= 1) level = 1;
      if (d.count >= 2) level = 2;
      if (d.count >= 4) level = 3;
      if (d.count >= 6) level = 4;
      return `<div class="contrib-cell" data-level="${level}" title="${d.date}: ${d.count} problem${d.count !== 1 ? 's' : ''} solved"></div>`;
    }).join('');
  }

  load();
</script>
</body>
</html>
