<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Add or edit a coding problem and solution revisions in GreenGrid.">
<title id="page-title">Add Problem — GreenGrid</title>
<link href="css/styles.css" rel="stylesheet">
<style>
  #monaco-container {
    height: 400px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    transition: border-color var(--t-fast);
  }
  #monaco-container:focus-within { border-color: var(--accent-dim); }
  #monaco-placeholder {
    height: 400px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--bg-elevated);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--text-muted);
    font-size: .84rem;
  }
  .notes-textarea { min-height: 150px; }
</style>
</head>
<body>

<div id="gg-page">
  <!-- Page header with back link -->
  <div class="gg-page-header">
    <div>
      <a href="dashboard.html" class="text-muted-gg d-inline-flex align-items-center gap-1 mb-2"
         style="font-size:.8rem;text-decoration:none;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Dashboard
      </a>
      <h1 class="gg-page-title" id="form-heading">Add Problem</h1>
      <p class="gg-page-subtitle" id="form-subheading">Save your solution and commit it to GitHub automatically.</p>
    </div>
    <span class="text-accent mono" id="fetch-status" style="font-size:.78rem;margin-top:8px;"></span>
  </div>

  <form id="problem-form">
    <div class="row g-4">

      <!-- Left column: main fields -->
      <div class="col-lg-8">

        <!-- Basic info card -->
        <div class="gg-card mb-3">
          <div class="gg-section-title">Problem Info</div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label-gg" for="title">Problem Title *</label>
              <input type="text" class="form-control-gg" id="title" required placeholder="e.g. Two Sum">
            </div>
            <div class="col-md-6">
              <label class="form-label-gg" for="platform">Platform *</label>
              <select class="form-select-gg" id="platform" required>
                <option value="LeetCode">LeetCode</option>
                <option value="HackerRank">HackerRank</option>
                <option value="Codeforces">Codeforces</option>
                <option value="CodeChef">CodeChef</option>
                <option value="AtCoder">AtCoder</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label-gg" for="problemUrl">Problem URL</label>
              <input type="url" class="form-control-gg" id="problemUrl"
                     placeholder="https://leetcode.com/problems/two-sum/">
            </div>
            <div class="col-md-6">
              <label class="form-label-gg" for="difficulty">Difficulty *</label>
              <select class="form-select-gg" id="difficulty" required>
                <option value="EASY">Easy</option>
                <option value="MEDIUM">Medium</option>
                <option value="HARD">Hard</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label-gg" for="language">Language *</label>
              <!-- Populated by constants.js -->
              <select class="form-select-gg" id="language" required></select>
            </div>
            <div class="col-12">
              <label class="form-label-gg">Topics</label>
              <div class="d-flex flex-wrap gap-2 mb-2" id="tag-chips"></div>
              <input type="text" class="form-control-gg" id="tag-input"
                     placeholder="Type a topic and press Enter (e.g. Two Pointers)">
            </div>
          </div>
        </div>

        <!-- Revisions card (shown only in Edit mode) -->
        <div class="gg-card mb-3" id="revision-card" style="display:none;">
          <div class="gg-section-title">Solution Revision</div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label-gg" for="revision-select">Select Solution Revision</label>
              <select class="form-select-gg" id="revision-select"></select>
            </div>
            <div class="col-md-6">
              <label class="form-label-gg" for="revision-title">Revision Title / Label</label>
              <input type="text" class="form-control-gg" id="revision-title" placeholder="e.g. HashMap Approach">
            </div>
          </div>
        </div>

        <!-- Code editor card -->
        <div class="gg-card mb-3">
          <div class="gg-code-header">
            <label class="form-label-gg mb-0">Code *</label>
            <span class="text-muted-gg mono" id="editor-lang-label" style="font-size:.74rem;"></span>
          </div>
          <!-- Placeholder shown while Monaco loads -->
          <div id="monaco-placeholder">
            <div class="gg-spinner"></div>
            <span>Loading editor…</span>
          </div>
          <!-- Monaco mounts here (hidden until ready) -->
          <div id="monaco-container" style="display:none;"></div>
        </div>

        <!-- Notes card -->
        <div class="gg-card">
          <label class="form-label-gg" for="notes">Notes
            <span class="text-muted-gg" style="font-weight:400;"> — Markdown supported</span>
          </label>
          <textarea class="form-control-gg notes-textarea" id="notes"
                    placeholder="Explain your approach, edge cases, or learnings…"></textarea>
        </div>
      </div>

      <!-- Right column: meta + submit -->
      <div class="col-lg-4">
        <!-- Complexity -->
        <div class="gg-card mb-3">
          <div class="gg-section-title">Complexity</div>
          <label class="form-label-gg" for="timeComplexity">Time</label>
          <input type="text" class="form-control-gg mb-3" id="timeComplexity" placeholder="O(n)">
          <label class="form-label-gg" for="spaceComplexity">Space</label>
          <input type="text" class="form-control-gg" id="spaceComplexity" placeholder="O(1)">
        </div>

        <!-- Solved date -->
        <div class="gg-card mb-3">
          <label class="form-label-gg" for="solvedDate">Solved Date</label>
          <input type="date" class="form-control-gg" id="solvedDate">
        </div>

        <!-- Submit -->
        <div class="gg-card">
          <button type="submit" class="btn-gg-primary w-100 mb-3" id="save-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"/></svg>
            <span id="save-btn-text">Save &amp; Commit to GitHub</span>
          </button>
          <p class="text-muted-gg" style="font-size:.76rem;line-height:1.5;">
            Will commit to
            <code class="gg-sha" id="path-preview" style="font-size:.72rem;">Easy/Two Sum/</code>
            in your connected repository.
          </p>
        </div>
      </div>

    </div>
  </form>
</div>

<!-- Monaco loader -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js" defer></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/shell.js"></script>
<script src="js/constants.js"></script>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const problemId = urlParams.get('id');
  const isEditMode = Boolean(problemId);

  GGShell.render(isEditMode ? 'edit-problem' : 'add-problem');

  if (isEditMode) {
    document.getElementById('page-title').textContent = 'Edit Problem — GreenGrid';
    document.getElementById('form-heading').textContent = 'Edit Problem & Revisions';
    document.getElementById('form-subheading').textContent = 'Update problem metadata, edit existing solution revisions, or save a new revision.';
    document.getElementById('revision-card').style.display = 'block';
    document.getElementById('save-btn-text').textContent = 'Save Changes & Commit';
  }

  // ---- Populate language dropdown from constants -------------------------
  GG_LANGUAGES.populate(document.getElementById('language'), { selected: 'Java' });

  // ---- Set today's date --------------------------------------------------
  document.getElementById('solvedDate').valueAsDate = new Date();

  // ---- Monaco: load asynchronously ---------------------------------------
  let editor = null;
  let problemData = null;
  let currentRevisions = [];

  function initMonaco() {
    if (typeof require === 'undefined') {
      setTimeout(initMonaco, 100);
      return;
    }
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
    require(['vs/editor/editor.main'], () => {
      const container  = document.getElementById('monaco-container');
      const placeholder = document.getElementById('monaco-placeholder');
      const langEl     = document.getElementById('language');
      const monacoLang = GG_LANGUAGES.monacoMap[langEl.value] || 'plaintext';

      editor = monaco.editor.create(container, {
        value: '',
        language: monacoLang,
        theme: document.documentElement.dataset.theme === 'light' ? 'vs' : 'vs-dark',
        fontSize: 13.5,
        fontFamily: "'JetBrains Mono', monospace",
        minimap: { enabled: false },
        automaticLayout: true,
        padding: { top: 14, bottom: 14 },
        scrollBeyondLastLine: false,
        lineNumbers: 'on',
        renderLineHighlight: 'gutter',
      });

      placeholder.style.display = 'none';
      container.style.display   = 'block';
      updateEditorLangLabel();

      if (isEditMode) {
        loadExistingProblem();
      }
    });
  }

  requestIdleCallback ? requestIdleCallback(initMonaco) : setTimeout(initMonaco, 0);

  function updateEditorLangLabel() {
    const langEl = document.getElementById('language');
    document.getElementById('editor-lang-label').textContent =
      langEl.options[langEl.selectedIndex]?.text || '';
  }

  document.getElementById('language').addEventListener('change', (e) => {
    const monacoLang = GG_LANGUAGES.monacoMap[e.target.value] || 'plaintext';
    if (editor) monaco.editor.setModelLanguage(editor.getModel(), monacoLang);
    updateEditorLangLabel();
  });

  // ---- Tags --------------------------------------------------------------
  let tags = [];
  function renderTags() {
    document.getElementById('tag-chips').innerHTML = tags.map((t, i) => `
      <span class="tag-chip">${t}<button type="button" data-i="${i}" aria-label="Remove ${t}">&times;</button></span>
    `).join('');
    document.querySelectorAll('.tag-chip button').forEach(b =>
      b.addEventListener('click', () => { tags.splice(+b.dataset.i, 1); renderTags(); }));
  }
  document.getElementById('tag-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const v = e.target.value.trim();
      if (v && !tags.includes(v)) { tags.push(v); renderTags(); }
      e.target.value = '';
    }
  });

  // ---- Path preview ------------------------------------------------------
  function updatePathPreview() {
    const diff      = document.getElementById('difficulty');
    const diffLabel = diff.options[diff.selectedIndex]?.text || 'Easy';
    const title     = document.getElementById('title').value.trim() || 'Problem Title';
    document.getElementById('path-preview').textContent = `${diffLabel}/${title}/`;
  }
  document.getElementById('difficulty').addEventListener('change', updatePathPreview);
  document.getElementById('title').addEventListener('input', updatePathPreview);
  updatePathPreview();

  // ---- Load existing problem in edit mode -------------------------------
  async function loadExistingProblem() {
    GGShell.progress.show();
    try {
      const res = await GGApi.get('/api/problems/' + problemId);
      problemData = res.data;

      document.getElementById('title').value          = problemData.title || '';
      document.getElementById('platform').value       = problemData.platform || 'LeetCode';
      document.getElementById('problemUrl').value     = problemData.problemUrl || '';
      document.getElementById('difficulty').value     = problemData.difficulty || 'EASY';
      document.getElementById('timeComplexity').value = problemData.timeComplexity || '';
      document.getElementById('spaceComplexity').value= problemData.spaceComplexity || '';
      document.getElementById('notes').value           = problemData.notes || '';
      if (problemData.solvedDate) {
        document.getElementById('solvedDate').value  = problemData.solvedDate;
      }
      tags = problemData.topics || [];
      renderTags();
      updatePathPreview();

      currentRevisions = problemData.revisions || [];
      populateRevisionSelect();
    } catch (err) {
      GGToast.error(err);
    } finally {
      GGShell.progress.done();
    }
  }

  function populateRevisionSelect() {
    const sel = document.getElementById('revision-select');
    let html = '';

    if (currentRevisions.length > 0) {
      currentRevisions.forEach(r => {
        const label = r.title ? `Rev ${r.revisionNumber}: ${r.title} (${r.language})` : `Rev ${r.revisionNumber} (${r.language})`;
        html += `<option value="${r.id}">${label}</option>`;
      });
    } else {
      html += `<option value="LATEST">Revision 1 (Current Solution - ${problemData.language || 'Java'})</option>`;
    }

    const nextNum = currentRevisions.length > 0
      ? Math.max(...currentRevisions.map(r => r.revisionNumber)) + 1
      : 2;

    html += `<option value="NEW">+ Save as New Revision (Revision ${nextNum})</option>`;
    sel.innerHTML = html;

    // Load first revision by default
    onRevisionSelectChange();
  }

  function onRevisionSelectChange() {
    const selVal = document.getElementById('revision-select').value;
    const revTitleInput = document.getElementById('revision-title');
    const langSelect = document.getElementById('language');
    const notesInput = document.getElementById('notes');
    const timeComp   = document.getElementById('timeComplexity');
    const spaceComp  = document.getElementById('spaceComplexity');

    if (selVal === 'NEW') {
      const nextNum = currentRevisions.length > 0
        ? Math.max(...currentRevisions.map(r => r.revisionNumber)) + 1
        : 2;
      revTitleInput.value = `Revision ${nextNum}`;
      if (editor) editor.setValue('');
      notesInput.value = '';
      timeComp.value = '';
      spaceComp.value = '';
    } else {
      const selectedRev = currentRevisions.find(r => r.id === selVal);
      if (selectedRev) {
        revTitleInput.value = selectedRev.title || `Revision ${selectedRev.revisionNumber}`;
        if (selectedRev.language) {
          langSelect.value = selectedRev.language;
          const monacoLang = GG_LANGUAGES.monacoMap[selectedRev.language] || 'plaintext';
          if (editor) monaco.editor.setModelLanguage(editor.getModel(), monacoLang);
          updateEditorLangLabel();
        }
        if (editor) editor.setValue(selectedRev.code || '');
        notesInput.value = selectedRev.notes || '';
        timeComp.value   = selectedRev.timeComplexity || '';
        spaceComp.value  = selectedRev.spaceComplexity || '';
      } else {
        // Fallback to top-level problem fields
        revTitleInput.value = 'Initial Solution';
        if (problemData.language) {
          langSelect.value = problemData.language;
          const monacoLang = GG_LANGUAGES.monacoMap[problemData.language] || 'plaintext';
          if (editor) monaco.editor.setModelLanguage(editor.getModel(), monacoLang);
          updateEditorLangLabel();
        }
        if (editor) editor.setValue(problemData.code || '');
      }
    }
  }

  document.getElementById('revision-select')?.addEventListener('change', onRevisionSelectChange);

  // ---- LeetCode auto-fetch -----------------------------------------------
  let fetchTimer;
  document.getElementById('problemUrl').addEventListener('input', (e) => {
    clearTimeout(fetchTimer);
    const url = e.target.value.trim();
    if (!url.includes('leetcode.com/problems/')) return;
    fetchTimer = setTimeout(() => fetchLeetCodeMetadata(url), 700);
  });

  async function fetchLeetCodeMetadata(url) {
    const statusEl = document.getElementById('fetch-status');
    statusEl.textContent = 'Fetching problem metadata…';
    try {
      const res = await GGApi.get('/api/problems/fetch-metadata?url=' + encodeURIComponent(url));
      if (res.data.found) {
        if (res.data.title)    document.getElementById('title').value = res.data.title;
        if (res.data.difficulty) document.getElementById('difficulty').value = res.data.difficulty;
        if (res.data.topics)   { tags = [...new Set([...tags, ...res.data.topics])]; renderTags(); }
        document.getElementById('platform').value = 'LeetCode';
        updatePathPreview();
        statusEl.textContent = '✓ Auto-filled from LeetCode';
        setTimeout(() => { statusEl.textContent = ''; }, 4000);
      } else {
        statusEl.textContent = '';
      }
    } catch {
      statusEl.textContent = '';
    }
  }

  // ---- Submit ------------------------------------------------------------
  document.getElementById('problem-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn  = document.getElementById('save-btn');
    const code = editor ? editor.getValue().trim() : '';
    if (!code) { GGToast.error({ message: 'Please paste your solution code.' }); return; }

    btn.disabled    = true;
    document.getElementById('save-btn-text').textContent = 'Saving & pushing to GitHub…';
    GGShell.progress.show();

    try {
      if (!isEditMode) {
        // Create new problem
        const payload = {
          platform:       document.getElementById('platform').value,
          title:          document.getElementById('title').value.trim(),
          problemUrl:     document.getElementById('problemUrl').value.trim() || null,
          difficulty:     document.getElementById('difficulty').value,
          topics:         tags,
          language:       document.getElementById('language').value,
          code,
          notes:          document.getElementById('notes').value,
          timeComplexity: document.getElementById('timeComplexity').value,
          spaceComplexity:document.getElementById('spaceComplexity').value,
          solvedDate:     document.getElementById('solvedDate').value,
        };
        const res = await GGApi.post('/api/problems', payload);

        if (res.data.commitStatus === 'COMMITTED') {
          GGToast.success('Saved and committed to GitHub!');
        } else {
          GGToast.show('Saved, but the GitHub push failed — you can retry from Search.', 'error');
        }
      } else {
        // Edit existing problem: Send EXACTLY 1 single API request
        const selVal = document.getElementById('revision-select').value;
        const revPayload = {
          title:           document.getElementById('revision-title').value.trim() || null,
          language:        document.getElementById('language').value,
          code,
          notes:           document.getElementById('notes').value,
          timeComplexity:  document.getElementById('timeComplexity').value,
          spaceComplexity: document.getElementById('spaceComplexity').value,
          // Problem metadata fields
          platform:        document.getElementById('platform').value,
          problemTitle:    document.getElementById('title').value.trim(),
          problemUrl:      document.getElementById('problemUrl').value.trim() || null,
          difficulty:      document.getElementById('difficulty').value,
          topics:          tags,
          solvedDate:      document.getElementById('solvedDate').value,
        };

        if (selVal === 'NEW') {
          await GGApi.post(`/api/problems/${problemId}/revisions`, revPayload);
          GGToast.success('New revision created & metadata updated!');
        } else if (selVal && selVal !== 'LATEST') {
          await GGApi.put(`/api/problems/${problemId}/revisions/${selVal}`, revPayload);
          GGToast.success('Revision & problem metadata updated!');
        } else {
          // Fallback to update problem endpoint
          const metaPayload = {
            platform:       document.getElementById('platform').value,
            title:          document.getElementById('title').value.trim(),
            problemUrl:     document.getElementById('problemUrl').value.trim() || null,
            difficulty:     document.getElementById('difficulty').value,
            topics:         tags,
            language:       document.getElementById('language').value,
            code,
            notes:          document.getElementById('notes').value,
            timeComplexity: document.getElementById('timeComplexity').value,
            spaceComplexity:document.getElementById('spaceComplexity').value,
            solvedDate:     document.getElementById('solvedDate').value,
          };
          await GGApi.put(`/api/problems/${problemId}`, metaPayload);
          GGToast.success('Problem & revision updated!');
        }
      }

      window.location.href = 'dashboard.html';
    } catch (err) {
      if (err && (err.status === 409 || err.existingProblemId)) {
        const existingId = err.existingProblemId;
        const msg = err.message || 'A problem with this title already exists.';
        let dupAlert = document.getElementById('duplicate-alert');
        if (!dupAlert) {
          dupAlert = document.createElement('div');
          dupAlert.id = 'duplicate-alert';
          dupAlert.className = 'alert alert-warning d-flex justify-content-between align-items-center mb-4';
          dupAlert.style.cssText = 'border-radius:10px;background:rgba(255,193,7,0.12);border:1px solid rgba(255,193,7,0.3);color:var(--warning);padding:12px 16px;';
          const headerEl = document.querySelector('.gg-page-header');
          if (headerEl) headerEl.insertAdjacentElement('afterend', dupAlert);
          else document.getElementById('gg-page').prepend(dupAlert);
        }
        dupAlert.innerHTML = `
          <div>
            <strong>Duplicate Problem:</strong> ${msg}
          </div>
          ${existingId ? `<a href="problem-form.html?id=${existingId}" class="btn-gg-outline btn-sm" style="white-space:nowrap;margin-left:12px;">Open Existing Problem</a>` : ''}
        `;
        GGToast.error(msg);
      } else {
        GGToast.error(err);
      }
      btn.disabled    = false;
      document.getElementById('save-btn-text').textContent = isEditMode ? 'Save Changes & Commit' : 'Save & Commit to GitHub';
      GGShell.progress.done();
    }
  });
</script>
</body>
</html>
