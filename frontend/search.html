<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Search and filter your solved coding problems in GreenGrid.">
<title>Search — GreenGrid</title>
<link href="css/styles.css" rel="stylesheet">
</head>
<body>

<div id="gg-page">
  <!-- Page header -->
  <div class="gg-page-header">
    <div>
      <h1 class="gg-page-title">Search Problems</h1>
      <p class="gg-page-subtitle">Filter and review everything you've solved.</p>
    </div>
    <a href="problem-form.html" class="btn-gg-primary">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Add Problem
    </a>
  </div>

  <!-- Filter card -->
  <div class="gg-card mb-4">
    <div class="gg-section-title">Filters</div>
    <div class="row g-3">
      <!-- Text search across title & topics -->
      <div class="col-md-4">
        <label class="form-label-gg" for="f-search">Search</label>
        <input type="text" class="form-control-gg" id="f-search" placeholder="Search title or topics (e.g. Binary Tree)...">
      </div>
      <!-- Starred filter -->
      <div class="col-md-2">
        <label class="form-label-gg" for="f-starred">Starred</label>
        <select class="form-select-gg" id="f-starred">
          <option value="">All</option>
          <option value="true">Starred Only ★</option>
          <option value="false">Not Starred</option>
        </select>
      </div>
      <!-- Revision Status filter -->
      <div class="col-md-3">
        <label class="form-label-gg" for="f-revision-status">Revision Status</label>
        <select class="form-select-gg" id="f-revision-status">
          <option value="">All</option>
          <option value="NONE">Not Set</option>
          <option value="NEEDS_REVISION">Needs Revision</option>
          <option value="MASTERED">Mastered</option>
        </select>
      </div>
      <!-- Difficulty filter -->
      <div class="col-md-3">
        <label class="form-label-gg" for="f-difficulty">Difficulty</label>
        <select class="form-select-gg" id="f-difficulty">
          <option value="">All</option>
          <option value="EASY">Easy</option>
          <option value="MEDIUM">Medium</option>
          <option value="HARD">Hard</option>
        </select>
      </div>
      <!-- Language filter -->
      <div class="col-md-3">
        <label class="form-label-gg" for="f-language">Language</label>
        <select class="form-select-gg" id="f-language"></select>
      </div>
      <!-- Platform filter -->
      <div class="col-md-3">
        <label class="form-label-gg" for="f-platform">Platform</label>
        <input type="text" class="form-control-gg" id="f-platform" placeholder="LeetCode">
      </div>
      <!-- Solved Date filter -->
      <div class="col-md-3">
        <label class="form-label-gg" for="f-date">Solved Date</label>
        <input type="date" class="form-control-gg" id="f-date">
      </div>
      <!-- Action buttons -->
      <div class="col-md-3 d-flex align-items-end gap-2">
        <button class="btn-gg-primary" id="search-btn" style="flex:1;">Search</button>
        <button class="btn-gg-outline" id="clear-btn">Clear</button>
      </div>
    </div>
  </div>

  <!-- Results count -->
  <div class="d-flex justify-content-between align-items-center mb-3" id="results-header" style="display:none!important;">
    <span class="text-muted-gg" style="font-size:.82rem;" id="results-count"></span>
  </div>

  <!-- Results -->
  <div id="results"></div>

  <!-- Pagination -->
  <div class="d-flex justify-content-between align-items-center mt-4" id="pagination" style="display:none!important;">
    <button class="btn-gg-outline" id="prev-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
      Previous
    </button>
    <span class="mono text-muted-gg" id="page-label" style="font-size:.8rem;"></span>
    <button class="btn-gg-outline" id="next-btn">
      Next
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/shell.js"></script>
<script src="js/constants.js"></script>
<script>
  GGShell.render('search');

  // Populate language filter dropdown (with "Any" option)
  GG_LANGUAGES.populate(document.getElementById('f-language'), { includeAny: true });

  // ---- State ---------------------------------------------------------------
  let currentPage = 0;
  let totalPages  = 1;
  let totalItems  = 0;
  let debounceTimer;

  // ---- Query builder -------------------------------------------------------
  function buildQuery() {
    const params = new URLSearchParams();
    const search   = document.getElementById('f-search').value.trim();
    const starred  = document.getElementById('f-starred').value;
    const revStat  = document.getElementById('f-revision-status').value;
    const diff     = document.getElementById('f-difficulty').value;
    const language = document.getElementById('f-language').value;
    const platform = document.getElementById('f-platform').value.trim();
    const date     = document.getElementById('f-date').value;

    if (search)   params.set('search',         search);
    if (starred)  params.set('favorite',       starred);
    if (revStat)  params.set('revisionStatus', revStat);
    if (diff)     params.set('difficulty',     diff);
    if (language) params.set('language',       language);
    if (platform) params.set('platform',       platform);
    if (date)     params.set('date',           date);
    params.set('page', currentPage);
    params.set('size', 12);
    return params.toString();
  }

  const DIFF_BADGE  = { EASY: 'badge-easy', MEDIUM: 'badge-medium', HARD: 'badge-hard' };
  const DIFF_LABEL  = { EASY: 'Easy',       MEDIUM: 'Medium',       HARD: 'Hard' };
  const REVISION_OPTS = [
    { value: 'NONE',           label: 'Not set' },
    { value: 'NEEDS_REVISION', label: 'Needs revision' },
    { value: 'MASTERED',       label: 'Mastered' },
  ];

  // ---- Render a single problem card ----------------------------------------
  function renderCard(p) {
    const revOptions = REVISION_OPTS.map(o =>
      `<option value="${o.value}" ${p.revisionStatus === o.value ? 'selected' : ''}>${o.label}</option>`
    ).join('');

    const topicsHtml = p.topics && p.topics.length
      ? p.topics.map(t => `<span class="badge-gg badge-neutral">${t}</span>`).join('')
      : '';

    return `
      <div class="gg-problem-card" data-id="${p.id}">
        <div class="d-flex justify-content-between align-items-start gap-3">
          <div style="min-width:0;flex:1;">
            <div class="d-flex align-items-center gap-2 flex-wrap mb-1">
              ${p.problemUrl
                ? `<a href="${p.problemUrl}" target="_blank" rel="noopener" class="gg-problem-title" style="color:var(--text-primary);">${p.title} <span style="color:var(--text-muted);font-size:.72rem;">↗</span></a>`
                : `<span class="gg-problem-title">${p.title}</span>`}
              <span class="badge-gg ${DIFF_BADGE[p.difficulty]}">${DIFF_LABEL[p.difficulty]}</span>
              <span class="badge-gg badge-neutral">${p.revisionCount || 1} Rev${(p.revisionCount || 1) !== 1 ? 's' : ''}</span>
              ${p.favorite ? '<span title="Starred" style="color:var(--warning);font-size:.9rem;" aria-label="Starred">★</span>' : ''}
            </div>
            <div class="gg-problem-meta">
              ${p.platform} · ${p.language} · ${p.solvedDate}
            </div>
            ${topicsHtml ? `<div class="d-flex flex-wrap gap-1 mt-2">${topicsHtml}</div>` : ''}
          </div>
          <div class="d-flex gap-2 align-items-center flex-shrink-0">
            <span class="badge-gg badge-status-${p.commitStatus.toLowerCase()}">${p.commitStatus}</span>
            <a href="problem-form.html?id=${p.id}" class="btn-gg-icon edit-btn" title="Edit problem & revisions" aria-label="Edit problem" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </a>
            <button class="btn-gg-icon fav-btn" title="${p.favorite ? 'Unstar problem' : 'Star problem'}" aria-label="Toggle star">
              ${p.favorite ? '★' : '☆'}
            </button>
            <button class="btn-gg-icon delete-btn" title="Delete problem" aria-label="Delete">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
            </button>
          </div>
        </div>

        <!-- Revision + commit SHA -->
        <div class="d-flex align-items-center gap-3 flex-wrap mt-3 pt-3" style="border-top:1px solid var(--border-soft);">
          <div class="d-flex align-items-center gap-2">
            <label class="text-muted-gg" style="font-size:.76rem;white-space:nowrap;">Revision:</label>
            <select class="form-select-gg revision-select" style="width:auto;padding:4px 28px 4px 10px;font-size:.78rem;">${revOptions}</select>
          </div>
          ${p.lastCommitSha ? `<span class="gg-sha ms-auto">${p.lastCommitSha.substring(0,7)}</span>` : ''}
        </div>
      </div>`;
  }

  // ---- Skeleton loading grid -----------------------------------------------
  function renderSkeletons(n = 6) {
    return Array.from({ length: n }, () =>
      `<div class="gg-skeleton mb-3" style="height:130px;border-radius:14px;"></div>`
    ).join('');
  }

  // ---- Main search ---------------------------------------------------------
  async function search() {
    const resultsEl = document.getElementById('results');
    resultsEl.innerHTML = renderSkeletons();
    document.getElementById('pagination').style.setProperty('display', 'none', 'important');
    document.getElementById('results-header').style.setProperty('display', 'none', 'important');

    GGShell.progress.show();
    try {
      const res  = await GGApi.get('/api/problems/search?' + buildQuery());
      const page = res.data;
      totalPages = page.totalPages;
      totalItems = page.totalElements;

      if (page.content.length === 0) {
        const queryStr = buildQuery().replace(/page=\d+&size=\d+/, '');
        const hasFilters = queryStr.length > 0;
        resultsEl.innerHTML = `
          <div class="gg-card">
            <div class="gg-empty-state">
              <div class="gg-empty-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
              </div>
              <p class="gg-empty-title">${hasFilters ? 'No problems match these filters' : 'No problems yet'}</p>
              <p class="gg-empty-desc">
                ${hasFilters
                  ? 'Try adjusting your filters or clearing them to see all problems.'
                  : 'Start by adding your first solved problem to GreenGrid.'}
              </p>
              ${hasFilters
                ? `<button class="btn-gg-outline" id="clear-from-empty">Clear filters</button>`
                : `<a href="problem-form.html" class="btn-gg-primary">Add your first problem</a>`}
            </div>
          </div>`;
        document.getElementById('clear-from-empty')
          ?.addEventListener('click', clearFilters);
        return;
      }

      resultsEl.innerHTML = page.content.map(renderCard).join('');
      bindCardActions();

      // Results header
      const header = document.getElementById('results-header');
      header.style.setProperty('display', 'flex', 'important');
      document.getElementById('results-count').textContent =
        `${totalItems} problem${totalItems !== 1 ? 's' : ''} · page ${currentPage + 1} of ${totalPages}`;

      // Pagination
      const pag  = document.getElementById('pagination');
      pag.style.setProperty('display', 'flex', 'important');
      document.getElementById('page-label').textContent = `Page ${currentPage + 1} of ${totalPages}`;
      document.getElementById('prev-btn').disabled = currentPage === 0;
      document.getElementById('next-btn').disabled = currentPage >= totalPages - 1;

    } catch (err) {
      GGToast.error(err);
      resultsEl.innerHTML = '';
    } finally {
      GGShell.progress.done();
    }
  }

  // ---- Card event bindings -------------------------------------------------
  function bindCardActions() {
    // Revision status
    document.querySelectorAll('.revision-select').forEach(sel => {
      sel.addEventListener('change', async () => {
        const id = sel.closest('[data-id]').dataset.id;
        try {
          await GGApi.patch(`/api/problems/${id}/revision`, { revisionStatus: sel.value });
          GGToast.success('Revision status updated');
        } catch (err) { GGToast.error(err); }
      });
    });

    // Starred toggle
    document.querySelectorAll('.fav-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const card  = btn.closest('[data-id]');
        const id    = card.dataset.id;
        const nowFav = btn.textContent.trim() === '☆';
        try {
          await GGApi.patch(`/api/problems/${id}/revision`, { favorite: nowFav });
          search();
        } catch (err) { GGToast.error(err); }
      });
    });

    // Delete problem
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const card = btn.closest('[data-id]');
        const id = card ? card.dataset.id : null;
        if (!id) return;
        if (!confirm('Delete this problem from GreenGrid?\n\n(Your GitHub commit history is not affected.)')) return;
        try {
          await GGApi.delete(`/api/problems/${id}`);
          GGToast.success('Problem deleted');
          search();
        } catch (err) { GGToast.error(err); }
      });
    });
  }

  // ---- Filter controls -----------------------------------------------------
  function clearFilters() {
    ['f-search', 'f-platform', 'f-date'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    ['f-starred', 'f-revision-status', 'f-difficulty', 'f-language'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    currentPage = 0;
    search();
  }

  // Debounced auto-search on text inputs
  function debouncedSearch() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => { currentPage = 0; search(); }, 400);
  }

  ['f-search', 'f-platform'].forEach(id =>
    document.getElementById(id).addEventListener('input', debouncedSearch));

  ['f-starred', 'f-revision-status', 'f-difficulty', 'f-language', 'f-date'].forEach(id =>
    document.getElementById(id).addEventListener('change', () => { currentPage = 0; search(); }));

  document.getElementById('search-btn').addEventListener('click', () => { currentPage = 0; search(); });
  document.getElementById('clear-btn').addEventListener('click', clearFilters);

  document.getElementById('prev-btn').addEventListener('click', () => {
    if (currentPage > 0) { currentPage--; search(); }
  });
  document.getElementById('next-btn').addEventListener('click', () => {
    if (currentPage < totalPages - 1) { currentPage++; search(); }
  });

  // Read initial query params from URL if present
  const initParams = new URLSearchParams(window.location.search);
  if (initParams.has('search'))         document.getElementById('f-search').value = initParams.get('search');
  if (initParams.has('starred'))        document.getElementById('f-starred').value = initParams.get('starred');
  if (initParams.has('revisionStatus')) document.getElementById('f-revision-status').value = initParams.get('revisionStatus');
  if (initParams.has('difficulty'))     document.getElementById('f-difficulty').value = initParams.get('difficulty');
  if (initParams.has('language'))       document.getElementById('f-language').value = initParams.get('language');
  if (initParams.has('platform'))       document.getElementById('f-platform').value = initParams.get('platform');
  if (initParams.has('date'))           document.getElementById('f-date').value = initParams.get('date');

  // Initial load
  search();
</script>
</body>
</html>
